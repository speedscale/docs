name: MCP docs sync

# Regenerates docs/proxymock/how-it-works/mcp-tools.md from the latest
# released proxymock and opens (or refreshes) a single PR when the page
# changes. It only uses a release newer than the one recorded in
# scripts/mcp-docs-version.txt, so a page generated from an unreleased
# build is never rolled back to an older release.
#
# GitHub does not start other workflows for a PR opened with GITHUB_TOKEN,
# so pr.yaml never runs on the bot PR. This job runs the same writing gate
# and build before it pushes; close and reopen the PR to get a preview.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even if the latest release is not newer than the recorded version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-docs-sync
  cancel-in-progress: false

env:
  DOWNLOAD_URL: https://downloads.speedscale.com/proxymock/proxymock-linux-amd64
  SYNC_BRANCH: bot/mcp-docs-sync
  PAGE: docs/proxymock/how-it-works/mcp-tools.md
  VERSION_FILE: scripts/mcp-docs-version.txt

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # yarn install runs husky; its pre-push hook would repeat the build.
      HUSKY: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: find latest release
      id: release
      env:
        FORCE: ${{ inputs.force }}
      run: |
        published=$(curl -fsSI "$DOWNLOAD_URL" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-amz-meta-version" { print $2 }')
        if ! [[ "$published" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::unexpected published proxymock version '$published'"
          exit 1
        fi
        echo "version=$published" >> "$GITHUB_OUTPUT"

        recorded=$(tr -d '[:space:]' < "$VERSION_FILE")
        recorded=${recorded%%-*}
        newest=$(printf '%s\n%s\n' "$recorded" "$published" | sort -V | tail -n 1)
        if [ "$FORCE" = "true" ] || { [ "$published" != "$recorded" ] && [ "$newest" = "$published" ]; }; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "proxymock $published is not newer than $recorded, which generated the page; nothing to do."
        fi

    - name: download proxymock
      if: steps.release.outputs.run == 'true'
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        bin="$RUNNER_TEMP/proxymock"
        curl -fsSL -o "$bin" "$DOWNLOAD_URL"
        echo "$(curl -fsSL "$DOWNLOAD_URL.sha256")  $bin" | sha256sum -c -
        chmod +x "$bin"
        # A release published between the header check and the download
        # would leave the page recorded under the wrong version.
        reported=$("$bin" version --client 2>/dev/null | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*' | head -n 1 || true)
        if [ "$reported" != "$VERSION" ]; then
          echo "::error::downloaded proxymock reports '$reported', expected $VERSION"
          exit 1
        fi

    - name: regenerate
      id: regen
      if: steps.release.outputs.run == 'true'
      env:
        PROXYMOCK_VERSION: ${{ steps.release.outputs.version }}
      run: |
        # The release step already decided this version should be used.
        PROXYMOCK="$RUNNER_TEMP/proxymock" ALLOW_OLDER=1 bash scripts/gen-mcp-docs.sh
        if git diff --quiet -- "$PAGE"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "proxymock $PROXYMOCK_VERSION does not change $PAGE."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # main already matches the release (someone regenerated by hand), so an
    # open bot PR can only hold an outdated page.
    - name: close stale PR
      if: steps.regen.outputs.changed == 'false'
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        pr=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$pr" ]; then
          gh pr close "$pr" --delete-branch --comment "main already matches the MCP reference generated by proxymock $VERSION."
        fi

    - name: Setup Node.js
      if: steps.regen.outputs.changed == 'true'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '22'
        cache: yarn

    - name: install
      if: steps.regen.outputs.changed == 'true'
      run: yarn --frozen-lockfile --silent

    - name: commit
      if: steps.regen.outputs.changed == 'true'
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -c "$SYNC_BRANCH"
        git add "$PAGE" "$VERSION_FILE"
        git commit -m "Regenerate the MCP tools reference for proxymock $VERSION"

    - name: check public writing
      if: steps.regen.outputs.changed == 'true'
      run: yarn check:writing --base HEAD~1

    - name: build
      if: steps.regen.outputs.changed == 'true'
      run: yarn build

    - name: push and open PR
      if: steps.regen.outputs.changed == 'true'
      env:
        VERSION: ${{ steps.release.outputs.version }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh auth setup-git
        if git fetch --quiet origin "$SYNC_BRANCH" 2>/dev/null &&
          git diff --quiet FETCH_HEAD HEAD -- "$PAGE" "$VERSION_FILE"; then
          echo "$SYNC_BRANCH already holds this page."
        else
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
        fi

        title="Regenerate the MCP tools reference for proxymock $VERSION"
        body=$(cat <<EOF
        This PR regenerates \`$PAGE\` with \`scripts/gen-mcp-docs.sh\` from the released proxymock $VERSION. The MCP docs sync workflow opened it: $RUN_URL

        The writing gate and \`yarn build\` passed in that run. GitHub does not start the PR Preview workflow for a PR opened by \`GITHUB_TOKEN\`, so close and reopen this PR to get a preview.

        Review the diff against the proxymock release notes. If the gate fails on a later run, fix the description in \`speedctl/mcp\` in the speedscale repo; do not edit the page by hand.
        EOF
        )
        pr=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$pr" ]; then
          gh pr edit "$pr" --title "$title" --body "$body"
        else
          gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body "$body"
        fi

  notify:
    needs: sync
    if: always() && needs.sync.result == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: notify on failure
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        payload=$(jq -n --arg url "$RUN_URL" \
          '{text: "The nightly MCP docs sync failed, so the MCP tools reference may be out of date: \($url)"}')
        curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
