name: PR Cleanup

on:
  pull_request:
    types: [closed] # merging a PR closes it
    branches: [main]

permissions:
  id-token: write # This is required for requesting the AWS JWT
  contents: read # This is required for checkout

env:
  AWS_ROLE: ${{ secrets.AWS_ROLE }}
  AWS_REGION: us-east-1
  DOWNLOADS_PREVIEW_BUCKET: docs-preview.speedscale.com

jobs:
  cleanup_docs:
    runs-on: ubuntu-latest
    steps:
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.0.0
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Delete PR preview
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: aws s3 rm --recursive "s3://$DOWNLOADS_PREVIEW_BUCKET/pr-$PR_NUMBER"
