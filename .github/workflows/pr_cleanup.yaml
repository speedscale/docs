name: PR Cleanup

on:
  pull_request:
    types: [closed] # merging a PR closes it

permissions:
  contents: read

env:
  AWS_ROLE: ${{ secrets.AWS_ROLE }}
  AWS_REGION: us-east-1
  DOWNLOADS_PREVIEW_BUCKET: docs-preview.speedscale.com

jobs:
  cleanup_docs:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Delete PR preview
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: aws s3 rm --recursive "s3://$DOWNLOADS_PREVIEW_BUCKET/pr-$PR_NUMBER"
