name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.preview.outputs.run }}
      publish: ${{ steps.preview.outputs.publish }}
    runs-on: ubuntu-latest
    steps:
    - name: checkout tested merge
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: resolve preview
      id: preview
      run: node scripts/resolve-pr-preview.mjs

    - name: verify tested revision
      if: steps.preview.outputs.run == 'true'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"

    - name: Setup Node.js
      if: steps.preview.outputs.run == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: yarn

    - name: writing regression tests
      if: steps.preview.outputs.run == 'true'
      run: yarn test:writing

    - name: preview routing regression tests
      if: steps.preview.outputs.run == 'true'
      run: node --test scripts/tests/resolve-pr-preview.test.mjs scripts/tests/preview-publish.test.mjs

    - name: check public writing
      if: steps.preview.outputs.run == 'true'
      env:
        BASE_SHA: ${{ steps.preview.outputs.base_sha }}
      # The checkout is the merge of the PR into the current base branch, but
      # base.sha is the PR's merge base, which lags main on an older branch.
      # Diffing from it would count everything main gained since as the PR's.
      # The merge commit's first parent is the base tip it was merged onto.
      run: |
        if git rev-parse -q --verify HEAD^2 >/dev/null; then
          BASE_SHA=$(git rev-parse HEAD^1)
        fi
        yarn check:writing --base "$BASE_SHA"

    - name: install
      if: steps.preview.outputs.run == 'true'
      run: yarn --frozen-lockfile --silent

    - name: agent readability tests
      if: steps.preview.outputs.run == 'true'
      run: yarn test:agents

    - name: security regression tests
      if: steps.preview.outputs.run == 'true'
      run: node --test scripts/security-regressions.test.mjs scripts/tests/ssg-pool.test.mjs

    - name: check redirects
      if: steps.preview.outputs.run == 'true'
      env:
        BASE_SHA: ${{ steps.preview.outputs.base_sha }}
      run: node scripts/check-redirects.mjs "$BASE_SHA"

    - name: update url for preview
      if: steps.preview.outputs.run == 'true'
      env:
        PR_NUMBER: ${{ steps.preview.outputs.pr_number }}
      run: ./tools/update_preview_base.sh "pr-$PR_NUMBER"

    - name: build
      if: steps.preview.outputs.run == 'true'
      env:
        DOCS_PUBLIC_BASE_URL: http://docs-preview.speedscale.com.s3-website-us-east-1.amazonaws.com/pr-${{ steps.preview.outputs.pr_number }}/
      run: yarn build

    # Preserve legacy redirect filenames unsupported by artifact storage.
    - name: package site
      if: steps.preview.outputs.run == 'true'
      run: tar -czf "$RUNNER_TEMP/docs-site.tar.gz" -C build .

    - name: save site artifact
      if: steps.preview.outputs.run == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docs-site
        path: ${{ runner.temp }}/docs-site.tar.gz
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.run == 'true' && needs.build.outputs.publish == 'true' && !github.event.pull_request.draft && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      AWS_ROLE: ${{ secrets.AWS_PREVIEW_ROLE || secrets.AWS_ROLE }}
      AWS_REGION: us-east-1
      DOWNLOADS_PREVIEW_BUCKET: docs-preview.speedscale.com
    steps:
    - name: verify preview is current
      id: current
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
        publish=$(jq -r --arg sha "$EXPECTED_HEAD" --arg repo "$GITHUB_REPOSITORY" --argjson number "$PR_NUMBER" \
          '.number == $number and .state == "open" and .draft == false and .head.sha == $sha and .head.repo.full_name == $repo and .user.login != "dependabot[bot]"' <<< "$pr")
        echo "publish=$publish" >> "$GITHUB_OUTPUT"
        if [ "$publish" != true ]; then
          echo "Preview skipped: the pull request is closed, draft, or superseded."
        fi

    - name: download site artifact
      if: steps.current.outputs.publish == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docs-site
        path: site-artifact/

    - name: unpack site
      if: steps.current.outputs.publish == 'true'
      run: |
        python3 - <<'PYTHON'
        import tarfile
        with tarfile.open("site-artifact/docs-site.tar.gz", "r:gz") as archive:
            archive.extractall("build", filter="data")
        PYTHON

    # Run deployment code from the trusted base; the artifact contains site data.
    - name: checkout deploy script
      if: steps.current.outputs.publish == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: deploy-tools
        sparse-checkout: scripts/deploy-markdown.sh
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: configure aws credentials
      if: steps.current.outputs.publish == 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: upload preview
      if: steps.current.outputs.publish == 'true'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        aws s3 sync build "s3://$DOWNLOADS_PREVIEW_BUCKET/pr-$PR_NUMBER" --delete --exclude '*.md'
        bash deploy-tools/scripts/deploy-markdown.sh build "s3://$DOWNLOADS_PREVIEW_BUCKET/pr-$PR_NUMBER/"

    - name: show url
      if: steps.current.outputs.publish == 'true'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: echo "http://$DOWNLOADS_PREVIEW_BUCKET.s3-website-us-east-1.amazonaws.com/pr-$PR_NUMBER/"

    - name: Find Comment
      if: steps.current.outputs.publish == 'true'
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: Preview available at 'http://${{ env.DOWNLOADS_PREVIEW_BUCKET }}.s3-website-us-east-1.amazonaws.com/pr-${{ github.event.pull_request.number }}/'

    - name: Create or Update comment
      if: steps.current.outputs.publish == 'true'
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }} # This will be empty and a new comment will be made if no comment already exists
        issue-number: ${{ github.event.pull_request.number }}
        body: Preview available at 'http://${{ env.DOWNLOADS_PREVIEW_BUCKET }}.s3-website-us-east-1.amazonaws.com/pr-${{ github.event.pull_request.number }}/'
        edit-mode: replace
