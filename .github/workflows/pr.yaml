name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '22'
        cache: yarn

    - name: install
      run: yarn --frozen-lockfile --silent

    - name: security regression tests
      run: node --test scripts/security-regressions.test.mjs

    - name: check redirects
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: node scripts/check-redirects.mjs "$BASE_SHA"

    - name: update url for preview
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: ./tools/update_preview_base.sh "pr-$PR_NUMBER"

    - name: build
      run: yarn build

    - name: save site artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: docs-site
        path: build/
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    env:
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
      AWS_REGION: us-east-1
      DOWNLOADS_PREVIEW_BUCKET: docs-preview.speedscale.com
    steps:
    - name: download site artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: docs-site
        path: build/

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.0.0
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: upload preview
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: aws s3 sync build "s3://$DOWNLOADS_PREVIEW_BUCKET/pr-$PR_NUMBER"

    - name: show url
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: echo "http://$DOWNLOADS_PREVIEW_BUCKET.s3-website-us-east-1.amazonaws.com/pr-$PR_NUMBER/"

    - name: Find Comment
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: Preview available at 'http://${{ env.DOWNLOADS_PREVIEW_BUCKET }}.s3-website-us-east-1.amazonaws.com/pr-${{ github.event.pull_request.number }}/'

    - name: Create or Update comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }} # This will be empty and a new comment will be made if no comment already exists
        issue-number: ${{ github.event.pull_request.number }}
        body: Preview available at 'http://${{ env.DOWNLOADS_PREVIEW_BUCKET }}.s3-website-us-east-1.amazonaws.com/pr-${{ github.event.pull_request.number }}/'
        edit-mode: replace
