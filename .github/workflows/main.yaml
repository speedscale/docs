name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '22'
        cache: yarn

    - name: install
      run: yarn --frozen-lockfile --silent

    - name: security regression tests
      run: node --test scripts/security-regressions.test.mjs

    - name: check redirects
      env:
        BASE_SHA: ${{ github.event.before }}
      run: node scripts/check-redirects.mjs "$BASE_SHA"

    - name: build
      run: yarn build

    # Preserve legacy redirect filenames unsupported by artifact storage.
    - name: package site
      run: tar -czf "$RUNNER_TEMP/docs-site.tar.gz" -C build .

    - name: save site artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docs-site
        path: ${{ runner.temp }}/docs-site.tar.gz
        if-no-files-found: error
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
      AWS_REGION: us-east-1
      DOCS_BUCKET: docs.speedscale.com
      DIST_ID: ${{ secrets.DIST_ID }}
    steps:
    # Load deploy code from the pushed commit, never from the build artifact.
    - name: checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      with:
        persist-credentials: false

    - name: download site artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docs-site
        path: site-artifact/

    - name: unpack site
      run: |
        python3 - <<'PYTHON'
        import tarfile
        with tarfile.open("site-artifact/docs-site.tar.gz", "r:gz") as archive:
            archive.extractall("build", filter="data")
        PYTHON

    - name: validate redirect objects
      run: node scripts/deploy-redirect-objects.mjs build "$DOCS_BUCKET" --dry-run

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: upload main
      run: aws s3 sync --delete build "s3://$DOCS_BUCKET"

    # The sync above re-uploads the client-redirect stubs (200 + meta refresh)
    # every deploy; replace them with website-redirect objects so the S3
    # website endpoint answers 301 before the cache invalidation below.
    - name: deploy redirect objects
      run: node scripts/deploy-redirect-objects.mjs build "$DOCS_BUCKET"

    - name: invalidate cache
      run: aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'

  notify:
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: notify on failure
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        REF_NAME: ${{ github.ref_name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        payload=$(jq -n --arg ref "$REF_NAME" --arg repo "$REPOSITORY" \
          '{text: "I am pretty sad right now guys. My build is failing on *\($ref)* in repository *\($repo)*.  Please check on me soon."}')
        curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
