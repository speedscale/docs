<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Ideal linear scaling</title><desc id="desc">An idealized application with no shared bottleneck. Qualitative illustration, not measured benchmark data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607789"/></marker></defs><rect width="900" height="460" rx="18" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="70" y="43" fill="#20394e" font-size="24" font-weight="650">Ideal linear scaling</text><text x="70" y="70" fill="#657c8d" font-size="15">An idealized application with no shared bottleneck.</text><g stroke="#e4ebf0" stroke-width="1"><path d="M110 145H820 M110 215H820 M110 285H820"/><path d="M285 110V355 M460 110V355 M635 110V355"/></g><g stroke="#607789" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M110 355H825"/><path d="M110 355V103"/></g><text x="465" y="403" text-anchor="middle" fill="#3a566c" font-size="18">Resources</text><text x="40" y="235" text-anchor="middle" transform="rotate(-90 40 235)" fill="#3a566c" font-size="18">Throughput</text><path d="M115 350 L792 130" fill="none" stroke="#267e79" stroke-width="5" stroke-linecap="round"/><rect x="455" y="85" width="340" height="35" rx="8" fill="#f1f6f8"/><text x="625" y="109" text-anchor="middle" fill="#36566c" font-size="16">More resources, proportional throughput</text><text x="110" y="438" fill="#6d8090" font-size="13">Conceptual shape. No measured values or scale implied.</text></g></svg>