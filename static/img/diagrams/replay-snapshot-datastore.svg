<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">A snapshot supplies the generator and responder</title><desc id="desc">The snapshot is a datastore containing recorded request and response data. Dashed supply links load test data into the generator and mock response data into the responder. Solid arrows show replay requests from generator to application and dependency calls from application to responder; responses return on the same runtime connections.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f9fb"/></linearGradient><linearGradient id="gate" x2="1" y2="1"><stop stop-color="#174b51"/><stop offset="1" stop-color="#123447"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#65e4d4"/><stop offset="1" stop-color="#73bafa"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6579"/></marker><marker id="dataArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b0803a"/></marker></defs><rect width="1040" height="470" rx="24" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="42" y="45" font-size="26" font-weight="650" fill="#193c50" text-anchor="start">Snapshot-backed replay</text><text x="42" y="72" font-size="15" font-weight="400" fill="#607d8f" text-anchor="start">Stored data powers both components; replay traffic follows its own path.</text><rect x="42" y="245" width="956" height="166" rx="18" fill="#f0f6f8" stroke="#d5e2e8"/><text x="62" y="271" font-size="12" font-weight="650" fill="#688291" text-anchor="start" letter-spacing="1.4">REPLAY TRAFFIC</text><path d="M380 124 C380 93 660 93 660 124 V178 C660 209 380 209 380 178 Z" fill="#fff3dd" stroke="#b48b48" stroke-width="1.6"/><ellipse cx="520" cy="124" rx="140" ry="25" fill="#fff8e9" stroke="#b48b48" stroke-width="1.6"/><text x="520" y="158" font-size="21" font-weight="650" fill="#60491f" text-anchor="middle">Snapshot</text><text x="520" y="182" font-size="14" font-weight="400" fill="#7d6539" text-anchor="middle">Recorded request / response data</text><path d="M380 160H166V298" fill="none" stroke="#b0803a" stroke-width="2.1" stroke-dasharray="6 6" marker-end="url(#dataArrow)"/><path d="M660 160H874V298" fill="none" stroke="#b0803a" stroke-width="2.1" stroke-dasharray="6 6" marker-end="url(#dataArrow)"/><text x="205" y="146" font-size="14" font-weight="400" fill="#947139" text-anchor="start">Load recorded tests</text><text x="710" y="146" font-size="14" font-weight="400" fill="#947139" text-anchor="start">Load mock responses</text><rect x="74" y="298" width="188" height="83" rx="13" fill="white" stroke="#93b5c5" stroke-width="1.5"/><text x="168" y="331" font-size="20" font-weight="650" fill="#20465a" text-anchor="middle">Generator</text><text x="168" y="355" font-size="13" font-weight="400" fill="#668090" text-anchor="middle">Sends recorded tests</text><rect x="426" y="298" width="188" height="83" rx="13" fill="white" stroke="#93b5c5" stroke-width="1.5"/><text x="520" y="331" font-size="20" font-weight="650" fill="#20465a" text-anchor="middle">Application</text><text x="520" y="355" font-size="13" font-weight="400" fill="#668090" text-anchor="middle">System under test</text><rect x="778" y="298" width="188" height="83" rx="13" fill="white" stroke="#93b5c5" stroke-width="1.5"/><text x="872" y="331" font-size="20" font-weight="650" fill="#20465a" text-anchor="middle">Responder</text><text x="872" y="355" font-size="13" font-weight="400" fill="#668090" text-anchor="middle">Serves recorded mocks</text><path d="M265 320H419" stroke="#2b6579" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="342.0" y="309" font-size="12" font-weight="400" fill="#40687c" text-anchor="middle">Replay requests</text><path d="M617 320H771" stroke="#2b6579" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="694.0" y="309" font-size="12" font-weight="400" fill="#40687c" text-anchor="middle">Dependency calls</text><path d="M419 359H265" stroke="#2b6579" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="342.0" y="379" font-size="12" font-weight="400" fill="#40687c" text-anchor="middle">Responses</text><path d="M771 359H617" stroke="#2b6579" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="694.0" y="379" font-size="12" font-weight="400" fill="#40687c" text-anchor="middle">Mocked responses</text><text x="42" y="446" font-size="13" font-weight="400" fill="#8b703f" text-anchor="start">Dashed: snapshot data supply</text><text x="397" y="446" font-size="13" font-weight="400" fill="#40687c" text-anchor="start">Solid: request / response traffic</text></g></svg>