<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="630" viewBox="0 0 1480 630" role="img" aria-labelledby="title desc"><title id="title">Replay data model</title><desc id="desc">Inputs flow left to right into a Snapshot, then a replay produces a Report. Snapshot and Report keep their fields stacked vertically. A traffic transform template and recorded request/response pairs populate the snapshot. A test configuration template supplies report settings.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f9fb"/></linearGradient><linearGradient id="gate" x2="1" y2="1"><stop stop-color="#174b51"/><stop offset="1" stop-color="#123447"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#65e4d4"/><stop offset="1" stop-color="#73bafa"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6579"/></marker><marker id="dataArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b0803a"/></marker></defs><rect width="1480" height="630" rx="24" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="40" y="48" font-size="28" font-weight="650" fill="#203d50" text-anchor="start">Replay data model</text><text x="40" y="78" font-size="16" font-weight="400" fill="#607c8e" text-anchor="start">Inputs → snapshot → report. Stored contents remain vertical inside each artifact.</text><rect x="40" y="200" width="250" height="100" rx="14" fill="#edf5f8" stroke="#abc2ce"/><text x="165.0" y="239" font-size="19" font-weight="650" fill="#294d61" text-anchor="middle">Transform template</text><text x="165.0" y="266" font-size="14" font-weight="400" fill="#688291" text-anchor="middle">Reusable traffic rules</text><rect x="40" y="380" width="250" height="100" rx="14" fill="#edf5f8" stroke="#abc2ce"/><text x="165.0" y="419" font-size="19" font-weight="650" fill="#294d61" text-anchor="middle">Recorded traffic</text><text x="165.0" y="446" font-size="14" font-weight="400" fill="#688291" text-anchor="middle">Raw request / response pairs</text><rect x="820" y="106" width="230" height="90" rx="14" fill="#edf5f8" stroke="#abc2ce"/><text x="935.0" y="145" font-size="19" font-weight="650" fill="#294d61" text-anchor="middle">Test config template</text><text x="935.0" y="172" font-size="14" font-weight="400" fill="#688291" text-anchor="middle">Replay settings</text><rect x="365" y="145" width="370" height="424" rx="20" fill="#fff6e5" stroke="#c8a86d" stroke-width="1.6"/><text x="550.0" y="184" font-size="25" font-weight="650" fill="#23475b" text-anchor="middle">Snapshot</text><rect x="1085" y="145" width="355" height="424" rx="20" fill="#edf7f1" stroke="#8cb3a1" stroke-width="1.6"/><text x="1262.5" y="184" font-size="25" font-weight="650" fill="#23475b" text-anchor="middle">Report</text><rect x="389" y="211" width="322" height="48" rx="9" fill="white" stroke="#ddc89f"/><text x="550" y="241" font-size="16" font-weight="500" fill="#695532" text-anchor="middle">Traffic transforms</text><rect x="389" y="276" width="322" height="48" rx="9" fill="white" stroke="#ddc89f"/><text x="550" y="306" font-size="16" font-weight="500" fill="#695532" text-anchor="middle">Discovered tokens</text><rect x="389" y="341" width="322" height="48" rx="9" fill="white" stroke="#ddc89f"/><text x="550" y="371" font-size="16" font-weight="500" fill="#695532" text-anchor="middle">Raw request / response pairs</text><rect x="389" y="406" width="322" height="48" rx="9" fill="white" stroke="#ddc89f"/><text x="550" y="436" font-size="16" font-weight="500" fill="#695532" text-anchor="middle">Client requests</text><rect x="389" y="471" width="322" height="48" rx="9" fill="white" stroke="#ddc89f"/><text x="550" y="501" font-size="16" font-weight="500" fill="#695532" text-anchor="middle">Mock responses</text><rect x="1109" y="240" width="307" height="82" rx="11" fill="white" stroke="#bad4c7"/><text x="1262" y="271" font-size="20" font-weight="650" fill="#2b5b49" text-anchor="middle">Test config</text><text x="1262" y="297" font-size="14" font-weight="400" fill="#6b8579" text-anchor="middle">A copy of the replay settings</text><rect x="1109" y="365" width="307" height="157" rx="11" fill="white" stroke="#bad4c7"/><text x="1262" y="396" font-size="20" font-weight="650" fill="#2b5b49" text-anchor="middle">Replay evidence</text><text x="1262" y="422" font-size="14" font-weight="400" fill="#6b8579" text-anchor="middle">Requests and responses</text><text x="1262" y="449" font-size="14" font-weight="400" fill="#6b8579" text-anchor="middle">Assertions and metrics</text><text x="1262" y="476" font-size="14" font-weight="400" fill="#6b8579" text-anchor="middle">Replay results</text><path d="M290 250H357" fill="none" stroke="#2b6579" stroke-width="2" marker-end="url(#arrow)"/><path d="M290 430H357" fill="none" stroke="#2b6579" stroke-width="2" marker-end="url(#arrow)"/><path d="M735 450H1077" fill="none" stroke="#2b6579" stroke-width="2" marker-end="url(#arrow)"/><path d="M1050 151H1065V280H1101" fill="none" stroke="#2b6579" stroke-width="2" marker-end="url(#arrow)"/><text x="908" y="431" font-size="18" font-weight="600" fill="#2f647a" text-anchor="middle">Run replay</text><text x="40" y="604" font-size="15" font-weight="400" fill="#638090" text-anchor="start">Templates provide starting values; snapshots and reports retain their own configuration.</text></g></svg>